name = "bsnl-sim-portal"
main = "worker.js"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[assets]
directory = "./cf-assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
MONGODB_DB = "bsnl_sim"

